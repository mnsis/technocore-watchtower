[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "technocore-watchtower"
version = "0.1.0"
description = "Read-only security observability for public Technocore rooms"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1",
    "jinja2>=3.1,<4",
    "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
test = ["httpx2>=2,<3", "pytest>=9,<10"]
dev = [
    "httpx2>=2,<3",
    "mypy>=2.3,<3",
    "pip-audit>=2.10,<3",
    "pytest>=9,<10",
    "ruff>=0.16,<1",
]

[project.scripts]
watchtower-dashboard = "app.dashboard:run_local"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
include = ["app*"]
